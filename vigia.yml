name: Vigia de perfumes

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar lojas e avisar no Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python vigia.py
      - name: Guardar o estado
        run: |
          git config user.name "vigia-perfumes"
          git config user.email "vigia-perfumes@users.noreply.github.com"
          git add estado.json
          git diff --cached --quiet || (git commit -m "Atualiza estado" && git push)
